<!DOCTYPE html>
<html><head><title>Subscribe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Subscription</h2>
<form action="/subscribe1/step1" method="POST">  <!-- ✅ FIXED -->
    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" value="{{ session.username }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Goal</label>
        <select name="goal" class="form-select" required>
            <option value="neet_ug">NEET UG</option>
            <option value="mbbs_prof">MBBS Prof</option>
        </select>
    </div>
    <p>You are not subscribed.</p>
    <button type="submit" class="btn btn-primary">Proceed to Plans</button>
</form>
</body></html>
